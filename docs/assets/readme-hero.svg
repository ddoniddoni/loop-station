<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Loop Station</title>
  <desc id="description">Make a sound. Make it loop. A browser music project in development. Charcoal cover with lime, lavender, and coral loops.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#24292C" stroke-width="1"/>
    </pattern>
    <clipPath id="cover">
      <rect width="1200" height="440" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#cover)">
    <rect width="1200" height="440" fill="#101416"/>
    <path d="M670 0H1200V440H670Z" fill="url(#grid)"/>
    <path d="M670 0V440" stroke="#2B3134"/>
    <path d="M0 371H1200" stroke="#2B3134"/>

    <g font-family="Arial, Helvetica, sans-serif">
      <circle cx="61" cy="53" r="5" fill="#CEFA72"/>
      <text x="78" y="58" fill="#B8C2C4" font-size="13" font-weight="600" letter-spacing="2.5">A BROWSER MUSIC PROJECT</text>

      <text x="53" y="160" fill="#F4F5ED" font-size="91" font-weight="800" letter-spacing="-5">LOOP</text>
      <text x="53" y="248" fill="#F4F5ED" font-size="91" font-weight="800" letter-spacing="-5">STATION</text>
      <text x="59" y="308" fill="#C4CCCF" font-size="23" letter-spacing="0.2">Make a sound. <tspan fill="#CEFA72">Make it loop.</tspan></text>

      <rect x="984" y="35" width="174" height="31" rx="15.5" fill="#1C2520" stroke="#435438"/>
      <text x="1071" y="55" text-anchor="middle" fill="#CEFA72" font-size="11" font-weight="600" letter-spacing="1.4">IN DEVELOPMENT</text>

      <g transform="translate(918 220)">
        <circle r="129" stroke="#303A31" stroke-width="18"/>
        <circle r="129" stroke="#CEFA72" stroke-width="18" stroke-linecap="round" stroke-dasharray="610 201" transform="rotate(-90)"/>
        <circle r="96" stroke="#2D2A39" stroke-width="13"/>
        <circle r="96" stroke="#B6A6EF" stroke-width="13" stroke-linecap="round" stroke-dasharray="406 197" transform="rotate(38)"/>
        <circle r="67" stroke="#3B2B28" stroke-width="9"/>
        <circle r="67" stroke="#EE967E" stroke-width="9" stroke-linecap="round" stroke-dasharray="271 150" transform="rotate(159)"/>
        <circle r="38" fill="#1E2720"/>
        <path d="M-8-14 16 0-8 14Z" fill="#CEFA72"/>
        <path d="M0-155V-148M155 0H148M0 155V148M-155 0H-148" stroke="#829087" stroke-width="2"/>
      </g>

      <text x="59" y="412" fill="#D3DBD4" font-family="monospace" font-size="12" letter-spacing="1.6">01 RECORD</text>
      <path d="M179 407H204M199 402L204 407 199 412" stroke="#66746B"/>
      <text x="226" y="412" fill="#D3DBD4" font-family="monospace" font-size="12" letter-spacing="1.6">02 REPEAT</text>
      <path d="M346 407H371M366 402L371 407 366 412" stroke="#66746B"/>
      <text x="393" y="412" fill="#D3DBD4" font-family="monospace" font-size="12" letter-spacing="1.6">03 BUILD</text>
      <text x="1158" y="412" text-anchor="end" fill="#899891" font-family="monospace" font-size="12" letter-spacing="1.4">ONE SOUND AT A TIME.</text>
    </g>
  </g>
</svg>
